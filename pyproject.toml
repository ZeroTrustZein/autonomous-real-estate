[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-real-estate"
version = "0.1.0"
description = "Autonomous Real Estate Underwriting Swarm: Multi-agent cash-flow valuation, Monte Carlo risk simulation, and MCP tool interface for property portfolio stress testing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "mcp>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]

[project.scripts]
are-underwrite = "autonomous_real_estate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
